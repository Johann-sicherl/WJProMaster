<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eef1f4" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/wjpromaster.svg" type="image/svg+xml" />
    <title>WJCalcEng — WJProMaster</title>
  </head>
  <body>
    <main class="ce-principal">
      <aside class="ce-esq" aria-label="Esboço">
        <button id="ce-calc" class="ce-calc" title="Escolher a calculadora"></button>
        <div id="painel-comando" class="painel-comando"></div>
        <div id="ce-form" class="ce-form" hidden></div>
      </aside>
      <section class="ce-vista viewport-wrap">
        <div id="ce-viewport" class="viewport"></div>
        <svg id="ce-cg" class="ce-cg" aria-hidden="true"></svg>
        <div id="overlay-esboco" class="overlay-esboco"></div>
      </section>
      <aside id="ce-painel" class="ce-painel" aria-label="Massa e resultados"></aside>
      <section id="ce-calc-area" class="ce-calc-area" aria-label="Resolução" hidden></section>
    </main>
    <script type="module" src="/src/calceng/main.ts"></script>
  </body>
</html>
